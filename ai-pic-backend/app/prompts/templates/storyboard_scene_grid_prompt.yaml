name: storyboard_scene_grid_prompt
description: "scene Gong Ge storyboard Da Tu De LLM prompt text generate template(Fen Jie Shi structure)"
category: storyboard
version: "1.0"
author: "AI Video Studio"
created_at: "2026-06-11"
updated_at: "2026-06-11"

variables:
 story_tone:
 type: string
 required: false
 description: "story Ji Diao Zhai Yao"
 style:
 type: string
 required: false
 description: "Feng Ge Yao Qiu"
 scene:
 type: dict
 required: true
 description: "Chang Jing Xin Xi(scene_number/location/time/description)"
 characters:
 type: list
 required: false
 description: "Chu Chang character She Ding list(dict: name/appearance)"
 dialogues:
 type: list
 required: false
 description: "Gai scene dialogue Wen Ben list"
 stage_notes:
 type: list
 required: false
 description: "Gai scene Wu Tai prompt list"
 frames:
 type: list
 required: true
 description: "Gai scene storyboard Zhen list(dict: shot_type/camera_movement/composition/duration/description)"
 panel_count:
 type: integer
 required: true
 description: "Gong Ge Shu Liang"
 rows:
 type: integer
 required: true
 description: "Gong Ge Xing Shu"
 columns:
 type: integer
 required: true
 description: "Gong Ge Lie Shu"
 aspect_ratio:
 type: string
 required: true
 description: "Hua Fu Bi Li(Ru 16:9)"
 has_character_refs:
 type: boolean
 required: false
 description: "Shi Fou Xie Dai Ren Wu Can Kao image"
 has_environment_refs:
 type: boolean
 required: false
 description: "Shi Fou Xie Dai environment Can Kao image"

usage_examples:
 - story_tone: ""Zui Quan"Wu Xia Duan Ju"
 scene:
 scene_number: 1
 location: "outside the tavern"
 frames:
 - shot_type: "medium-long shot"
 description: "Zui Bu Ru Chang"
 panel_count: 12
 rows: 3
 columns: 4
 aspect_ratio: "16:9"
