name: script_scenes
description: "script scene planning prompt text template(Shi length Gan Zhi Ban)"
category: script
version: "2.0"
author: "AI Video Studio"
created_at: "2025-12-10"
updated_at: "2025-12-26"

variables:
 story:
 type: dict
 required: true
 description: "Story information (title/genre/summary, etc.)"

 episode:
 type: dict
 required: true
 description: "Episode information (episode number/title, etc.)"

 duration_minutes:
 type: number
 required: false
 description: "episode target Shi length(minutes), Yong Yu Shi length Gan Zhi scene Hua Fen"
 default: 0

 min_scene_seconds:
 type: number
 required: false
 description: "Dan scene Zui Xiao Shi length(seconds)"
 default: 10

 max_scene_seconds:
 type: number
 required: false
 description: "Dan scene Zui Da Shi length(seconds)"
 default: 120

 scene_detail_level:
 type: string
 required: false
 description: "scene Xi Jie Cheng Du"
 default: "medium"
 enum: ["minimal", "medium", "detailed", "cinematic"]

 format_type:
 type: string
 required: false
 description: "Ju Ben Ge Shi"
 default: "screenplay"
 enum: ["screenplay", "teleplay", "stage", "audio", "animation"]

 language:
 type: string
 required: false
 description: "language"
 default: "zh-CN"
 enum: ["zh-CN", "en-US", "ja-JP", "ko-KR"]

 style_preferences:
 type: list
 required: false
 description: "Style preference list"

 additional_requirements:
 type: string
 required: false
 description: "additional scene Yao Qiu"

usage_examples:
 - story: { title: "Wei Lai Zhi Cheng", genre: "science fiction" }
 episode: { episode_number: 1, title: "Jue Xing", duration_minutes: 3 }
 duration_minutes: 3
 scene_detail_level: "medium"
 format_type: "screenplay"
 language: "zh-CN"
