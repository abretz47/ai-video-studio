name: script_dialogues
description: "script dialogue Yu stage directions generate prompt text template"
category: script
version: "1.0"
author: "AI Video Studio"
created_at: "2025-12-10"
updated_at: "2025-12-10"

variables:
 language:
 type: string
 required: false
 description: "Dui Bai Yu Yan"
 default: "zh-CN"
 enum: ["zh-CN", "en-US", "ja-JP", "ko-KR"]

 dialogue_style:
 type: string
 required: false
 description: "Dui Bai Feng Ge"
 default: "natural"
 enum: ["natural", "formal", "casual", "dramatic", "comedic"]

 format_type:
 type: string
 required: false
 description: "Ju Ben Ge Shi"
 default: "screenplay"
 enum: ["screenplay", "teleplay", "stage", "audio", "animation"]

 story:
 type: dict
 required: false
 description: "story summary information"

 episode:
 type: dict
 required: false
 description: "Ju Ji Xin Xi"

 scenes:
 type: list
 required: true
 description: "Chang Jing Lie Biao, Han scene_number/slug_line etc."
 min_length: 1

usage_examples:
 - language: "zh-CN"
 dialogue_style: "natural"
 format_type: "screenplay"
 story: { title: "Chuang Ye Lu", genre: "drama" }
 episode: { episode_number: 1, title: "First Encounter" }
 scenes:
 - scene_number: 1
 slug_line: "INT. Ka Fei Guan - day"
 summary: "Liang Wei Protagonist Chu Ci Jian Mian"
