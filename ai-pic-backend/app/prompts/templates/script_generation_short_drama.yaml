name: script_generation_short_drama
description: "script generate prompt text template(short drama)"
category: script
version: "1.0"
author: "AI Video Studio"
created_at: "2026-01-18"
updated_at: "2026-01-18"

variables:
 story:
 type: dict
 required: true
 description: "story information object"

 episode:
 type: dict
 required: true
 description: "episode information object"

 format_type:
 type: string
 required: true
 description: "script format type"
 default: "teleplay"
 enum: ["screenplay", "teleplay", "stage", "audio", "animation"]

 language:
 type: string
 required: false
 description: "Ju Ben Yu Yan"
 default: "zh-CN"

 dialogue_style:
 type: string
 required: false
 description: "Dui Hua Feng Ge"
 default: "dramatic"
 enum: ["natural", "formal", "casual", "dramatic", "comedic"]

 scene_detail_level:
 type: string
 required: false
 description: "scene description Xiang Xi Cheng Du"
 default: "medium"
 enum: ["minimal", "medium", "detailed", "cinematic"]

 additional_requirements:
 type: string
 required: false
 description: "E Wai Yao Qiu"
 max_length: 1000

 style_preferences:
 type: list
 required: false
 description: "Style preference list"

output_format: "JSON"
expected_fields:
 - content
 - scenes
 - dialogues
 - stage_directions
 - metadata
