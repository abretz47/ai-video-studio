name: virtual_ip_image
description: "virtual IP image generate prompt text(Zhi Jie Yong Yu image model)"
category: image
version: "1.2"
author: "AI Video Studio"
created_at: "2026-01-09"
updated_at: "2026-01-12"

variables:
 character_name:
 type: string
 required: true
 description: "character name"
 min_length: 1

 character_description:
 type: string
 required: false
 description: "character Wai Guan Yu She Ding description(Ke Bao Han style, Fu Zhuang, Qi Zhi Deng)"

 background_story:
 type: string
 required: false
 description: "Bei Jing Gu Shi(optional)"

 style:
 type: string
 required: false
 description: "style(realistic/anime/cartoon/portrait/...)"
 default: "realistic"

 category:
 type: string
 required: false
 description: "Tu Xiang Lei Bie(portrait/full_body/action/emotion/...)"
 default: "portrait"

 style_prompt:
 type: string
 required: false
 description: "You style_spec Pai Sheng De Bu Chong style prompt text(optional)"

 additional_prompts:
 type: list
 required: false
 description: "Fu Jia prompt text list(Dou Hao Fen Ge Huo Shu Zu Shu Ru Hou Biao Zhun Hua)"

usage_examples:
 - character_name: "Mia"
 character_description: "22 years oldfemale, Yin Se Duan Fa, Jing Zhi Wu Guan, Qi Zhi Qing Leng, Hei Se Gao Ling Mao Yi"
 style: "realistic"
 category: "portrait"
 additional_prompts: ["studio lighting", "depth of field"]
