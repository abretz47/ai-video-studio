name: traffic_sheet_generation
description: traffic sheet generation template, from script Zhong Ti Lian 15/30/60 seconds Tou Liu Su Cai
category: marketing
version: "1.0"

variables:
 story:
 type: object
 description: story Shang Xia Wen(title, type, Shi Chang, Wei Lei Xing)
 required: false
 episode_id:
 type: integer
 description: episode ID
 required: false
 episode_number:
 type: integer
 description: Ju Ji Bian Hao
 required: true
 episode_title:
 type: string
 description: Ju Ji Biao Ti
 required: false
 episode_summary:
 type: string
 description: Ju Ji Gai Yao
 required: false
 script_id:
 type: integer
 description: script ID
 required: false
 script_content:
 type: string
 description: script Zheng Wen content
 required: true
 scenes:
 type: array
 description: Chang Jing Lie Biao
 required: false
 dialogues:
 type: array
 description: Dui Bai Lie Biao
 required: false
 hook_plan:
 type: object
 description: Shuang Dian/Gou Zi Gui Hua
 required: false
 current_time:
 type: string
 description: Dang Qian Shi Jian(ISO format)
 required: false

output_format: json
output_schema:
 type: object
 properties:
 episode_id:
 type: integer
 script_id:
 type: integer
 market_region:
 type: string
 micro_genre:
 type: string
 assets:
 type: array
 items:
 type: object
 properties:
 asset_id:
 type: string
 duration_seconds:
 type: integer
 enum: [15, 30, 60]
 market_region:
 type: string
 micro_genre:
 type: string
 hook_type:
 type: string
 enum:
 [betrayal, reveal, revenge, reunion, threat, taboo, power-shift]
 source_episode:
 type: integer
 source_timecode_start:
 type: string
 source_timecode_end:
 type: string
 key_line:
 type: string
 visual_hook:
 type: string
 shot_list:
 type: array
 items:
 type: string
 cliff_or_cta:
 type: string
 music_reference:
 type: string
 compliance_flags:
 type: array
 items:
 type: string
 generated_at:
 type: string
 format: date-time

tags:
 - short_drama
 - marketing
 - traffic
 - ad_material
