name: story_outline_short_drama
description: "Story outline generation prompt template(short drama)"
category: story
version: "1.0"
author: "AI Video Studio"
created_at: "2026-01-18"
updated_at: "2026-01-18"

variables:
 title:
 type: string
 required: true
 description: "Story title"
 min_length: 1
 max_length: 100

 story_format:
 type: string
 required: false
 description: "Gu Shi Xing Shi"
 enum: ["short_drama"]

 genre:
 type: string
 required: true
 description: "Story genre"
 examples: ["drama", "comedy", "romance", "suspense", "science fiction", "fantasy"]

 market_region:
 type: string
 required: false
 description: "Target market/region"
 examples: ["North America", "Southeast Asia", "Europe", "Latin America"]

 micro_genre:
 type: string
 required: false
 description: "Micro-genre / subgenre"
 examples: ["Ba Zong Fu Chou", "Lang Ren Lian Ai", "Hei Bang Fu Chou"]

 theme:
 type: string
 required: false
 description: "Story theme"
 max_length: 200

 target_audience:
 type: string
 required: false
 description: "Target audience"
 examples: ["teenagers", "young adults", "adults"]

 duration_minutes:
 type: number
 required: false
 description: "Total duration (minutes)"

 characters:
 type: list
 required: true
 description: "Main character list"
 min_length: 1

 setting_time:
 type: string
 required: false
 description: "Time setting"
 examples: ["modern", "ancient", "future", "Republic-era China"]

 setting_location:
 type: string
 required: false
 description: "Location setting"

 world_building:
 type: string
 required: false
 description: "Worldbuilding"

 additional_requirements:
 type: string
 required: false
 description: "Additional creative requirements"

 style_preferences:
 type: list
 required: false
 description: "Style preference list"

 content_restrictions:
 type: list
 required: false
 description: "Content restriction list"

output_format: "JSON"
expected_fields:
 - premise
 - synopsis
 - main_conflict
 - resolution
 - character_relationships
 - main_characters
 - plot_structure
 - core_values
 - visual_style
 - selling_points
 - hook_plan
 - twist_density
 - cliffhanger_plan
 - ad_snippets
