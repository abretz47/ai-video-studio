name: story_outline
description: "Story outline generation prompt template"
category: story
version: "1.0"
author: "AI Video Studio"
created_at: "2025-08-15"
updated_at: "2025-08-15"

variables:
 title:
 type: string
 required: true
 description: "Story title"
 min_length: 1
 max_length: 100

 genre:
 type: string
 required: true
 description: "Story genre"
 examples: ["drama", "comedy", "romance", "suspense", "science fiction", "fantasy"]

 market_region:
 type: string
 required: false
 description: "Target market/region"
 examples: ["North America", "Southeast Asia", "Europe", "Latin America"]

 micro_genre:
 type: string
 required: false
 description: "Micro-genre / subgenre"
 examples: ["CEO revenge", "werewolf romance", "gang revenge"]

 theme:
 type: string
 required: false
 description: "Story theme"
 max_length: 200

 target_audience:
 type: string
 required: false
 description: "Target audience"
 examples: ["children", "teenagers", "young adults", "adults", "families"]

 duration_minutes:
 type: number
 required: false
 description: "Total duration (minutes)"

 characters:
 type: list
 required: true
 description: "Main character list"
 min_length: 1

 setting_time:
 type: string
 required: false
 description: "Time setting"
 examples: ["modern", "ancient", "future", "Republic-era China", "1980s"]

 setting_location:
 type: string
 required: false
 description: "Location setting"

 world_building:
 type: string
 required: false
 description: "Worldbuilding"

 additional_requirements:
 type: string
 required: false
 description: "Additional creative requirements"

 style_preferences:
 type: list
 required: false
 description: "Style preference list"

 content_restrictions:
 type: list
 required: false
 description: "Content restriction list"

usage_examples:
 - title: "The Power of Friendship"
 genre: "drama"
 theme: "friendship and growth"
 target_audience: "young adults"
 duration_minutes: 150
 characters:
 - name: "Mia"
 description: "a lively college student"
 - name: "Leo"
 description: "an introverted programmer"
 setting_time: "modern"
 setting_location: "university campus"

output_format: "JSON"
expected_fields:
 - premise
 - synopsis
 - main_conflict
 - resolution
 - character_relationships
 - main_characters
 - plot_structure
 - core_values
 - visual_style
 - selling_points
 - hook_plan
 - twist_density
 - cliffhanger_plan
 - ad_snippets
