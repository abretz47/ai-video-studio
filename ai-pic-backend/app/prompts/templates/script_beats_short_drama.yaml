name: script_beats_short_drama
description: "short drama beat-level script structure generate template"
category: script
version: "1.0"
output_format: "JSON"
expected_fields:
 - contract_version
 - scenes

variables:
 story:
 type: dict
 required: true
 description: "Gu Shi Xin Xi"

 episode:
 type: dict
 required: true
 description: "Ju Ji Xin Xi"

 scenes:
 type: list
 required: true
 description: "Chang Jing Lie Biao"

 language:
 type: string
 required: false
 description: "language"
 default: "zh-CN"

 dialogue_style:
 type: string
 required: false
 description: "Dui Bai Feng Ge"
 default: "natural"

 target_chars_per_episode:
 type: number
 required: false
 description: "target Zheng Wen Chang Du"
 default: 1300

 additional_requirements:
 type: string
 required: false
 description: "Te Shu Yao Qiu"

 generation_mode:
 type: string
 required: false
 description: "Sheng Cheng Mo Shi"
 default: "standard"

 production_mode:
 type: boolean
 required: false
 description: "Shi Fou Wei production async generate"
 default: false

 script_score_thresholds:
 type: dict
 required: false
 description: "production ScriptScore Tong Guo Yu Zhi"
