 title: {{ story.title }}
 type: {{ story.genre }}
 {% if story.theme %}Zhu Ti: {{ story.theme }}{% endif %}
 {% if story.synopsis %}summary: {{ story.synopsis }}{% endif %}
 {% if story.main_conflict %}Zhu Yao Chong Tu: {{ story.main_conflict }}{% endif %}
 {% if story.resolution %}Jie Ju/Xie Fa: {{ story.resolution }}{% endif %}
 {% if story.world_building %}Shi Jie Guan: {{ story.world_building | trim | truncate(300, True, '...') }}{% endif %}

 ## character
 {% if story.main_characters -%}
 {% for char in story.main_characters %}
 - {{ char.name }}: {{ char.description or char.role }}
 {% endfor %}
 {% endif -%}
 {% if focus_characters -%}
 Zhong Dian Jue Se: {{ focus_characters | map(attribute='name') | list | join(', ') }}
 {% endif -%}

 ## Sheng Cheng Yao Qiu
 - Zong Ji Shu: {{ episode_count }} Ji{% if episode_duration %}, Mei Ji Yue {{ episode_duration }} minutes{% endif %}
 - plot Fu Za Du: {{ plot_complexity }}; pacing: {{ pacing }}
 - Mei Ji only Xu Yao 1 Ju logline, Ming Que Gai Ji Zhu Yao conflict/Zhuan Zhe/hook, Yu Zhu Xian Yi Zhi; Ke Gei Biao Ti.
 - beats/Xiang Xi Jie Dian Ci Jie Duan Ke Yi Sheng Lve(Ru Guo provide Ye Ke, Dan Fei Bi Tian).
