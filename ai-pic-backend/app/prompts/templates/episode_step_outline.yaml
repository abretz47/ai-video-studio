name: episode_step_outline
description: "based on story Xian Sheng Cheng Mei Ji De Step Outline(Mei Ji Yi Ju Hua logline)"
category: episode
version: "1.0"
author: "AI Video Studio"
created_at: "2025-12-13"
updated_at: "2025-12-13"

variables:
 story:
 type: dict
 required: true
 description: "story information object"
 episode_count:
 type: number
 required: true
 description: "Mu Biao Ji Shu"
 min: 1
 max: 50
 episode_duration:
 type: number
 required: false
 description: "Dan Ji target Shi length(minutes)"
 plot_complexity:
 type: string
 required: false
 description: "plot Fu Za Du simple/medium/complex"
 pacing:
 type: string
 required: false
 description: "pacing slow/medium/fast"
 focus_characters:
 type: list
 required: false
 description: "Zhong Dian character list"
 additional_requirements:
 type: string
 required: false
 description: "additional generate Yao Qiu"
 style_preferences:
 type: list
 required: false
 description: "style preference"

output_format: "JSON"
expected_fields:
 - episodes
 - episode_number
 - title
 - logline
 - beats (optional, Ke Wei Kong)

prompt: |
 you Shi Yi Ming episode Zhu Bian, Xian Bang Wo Ba story Chai Cheng「Step Outline」, **Mei Ji only Xu Yao Yi Ju Hua logline**(Bao Han Qi Cheng Zhuan He He hook, Xu Tie He Zhu Xian).Hou Xu Xi Jie Liu to episode generate Jie Duan.

