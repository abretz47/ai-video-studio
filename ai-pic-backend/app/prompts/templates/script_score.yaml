name: script_score
description: script Ping Fen template, Ping Gu short drama script De Tou Liu Xiao Guo Yu Zhi Zuo Ke Xing Xing
category: evaluation
version: "1.0"

variables:
 story:
 type: object
 description: story Shang Xia Wen(title, type, Shi Chang, Wei Lei Xing)
 required: false
 episode:
 type: object
 description: episode Shang Xia Wen(Ji Shu, title, summary)
 required: false
 script_content:
 type: string
 description: script Zheng Wen content
 required: true
 scenes:
 type: array
 description: Chang Jing Lie Biao
 required: false
 dialogues:
 type: array
 description: Dui Bai Lie Biao
 required: false

output_format: json
output_schema:
 type: object
 properties:
 overall_score:
 type: number
 minimum: 0
 maximum: 5
 dimension_scores:
 type: object
 properties:
 conflict_intensity:
 type: number
 character_recognizability:
 type: number
 cultural_fit:
 type: number
 clip_ability:
 type: number
 logic_coherence:
 type: number
 verdict:
 type: string
 enum: [pass, review, rewrite]
 strengths:
 type: array
 items:
 type: string
 risks:
 type: array
 items:
 type: string
 rewrite_guidance:
 type: array
 items:
 type: string
 suggested_ad_hooks:
 type: array
 items:
 type: string

tags:
 - short_drama
 - evaluation
 - scoring
