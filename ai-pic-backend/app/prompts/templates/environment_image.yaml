name: environment_image
description: "environment image generate prompt text template"
category: image
version: "1.3"
author: "AI Video Studio"
created_at: "2025-12-10"
updated_at: "2026-01-12"

variables:
 environment_name:
 type: string
 required: true
 description: "environment name Huo scene Zhu Ti"
 min_length: 1

 category:
 type: string
 required: false
 description: "Huan Jing Lei Bie(Ru Shi Nei/Shi Wai/Zi Ran/city)"
 default: "indoor"

 tags:
 type: string
 required: false
 description: "Huan Jing Biao Qian(Dou Hao Fen Ge)"

 description:
 type: string
 required: false
 description: "Huan Jing Miao Shu"

 prompt:
 type: string
 required: true
 description: "He Xin Zheng Xiang prompt text"

 additional_prompts:
 type: string
 required: false
 description: "Fu Jia Xiu Shi Ci Huo style Yao Qiu"

usage_examples:
 - environment_name: "future Ke Ji office"
 category: "indoor"
 tags: "science fiction, office, future"
 description: "Xuan Fu Ping Mu, Bo Li Ge Duan, Leng Se Diao Deng Guang"
 prompt: "Leng Se Diao science fiction office, Bo Li Ge Duan Yu Xuan Fu screen"
 additional_prompts: "Ti Ji Guang, Gao Dong Tai Fan Wei, film Ji Deng Guang"
