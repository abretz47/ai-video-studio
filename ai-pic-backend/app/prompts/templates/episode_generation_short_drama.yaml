name: episode_generation_short_drama
description: "episode generate prompt text template(short drama)"
category: episode
version: "1.0"
author: "AI Video Studio"
created_at: "2026-01-18"
updated_at: "2026-01-18"

variables:
 story:
 type: dict
 required: true
 description: "story information object"

 episode_count:
 type: number
 required: true
 description: "Yao generate De episode count"
 min: 1
 max: 200

 episode_duration:
 type: number
 required: false
 description: "Mei Ji Shi Chang(minutes)"
 min: 1
 max: 30

 plot_complexity:
 type: string
 required: false
 description: "plot Fu Za Du"
 default: "medium"
 enum: ["simple", "medium", "complex"]

 pacing:
 type: string
 required: false
 description: "pacing control"
 default: "fast"
 enum: ["slow", "medium", "fast"]

 focus_characters:
 type: list
 required: false
 description: "Zhong Dian character list"

 additional_requirements:
 type: string
 required: false
 description: "E Wai Yao Qiu"
 max_length: 1000

 style_preferences:
 type: list
 required: false
 description: "Style preference list"

output_format: "JSON"
expected_fields:
 - episodes
