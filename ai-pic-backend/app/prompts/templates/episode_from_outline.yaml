name: episode_from_outline
description: "based on Yi generate De Step Outline, Wei Dan Ji output complete Episode Plan(logline Bi Tian, beats optional)"
category: episode
version: "1.0"
author: "AI Video Studio"
created_at: "2025-12-13"
updated_at: "2025-12-13"

variables:
 story:
 type: dict
 required: true
 description: "story information object"
 outline:
 type: dict
 required: true
 description: "Dan Ji Step Outline(Han logline, beats optional)"
 previous_episodes:
 type: list
 required: false
 description: "Yi generate De Qian Xu Ji list(episode_number/title/logline)"
 episode_duration:
 type: number
 required: false
 description: "target duration(minutes)"
 plot_complexity:
 type: string
 required: false
 description: "plot Fu Za Du simple/medium/complex"
 pacing:
 type: string
 required: false
 description: "pacing slow/medium/fast"
 additional_requirements:
 type: string
 required: false
 description: "E Wai Yao Qiu"
 style_preferences:
 type: list
 required: false
 description: "style preference"

output_format: "JSON"
expected_fields:
 - episodes
 - episode_number
 - title
 - summary
 - plot_points
 - character_arcs
 - conflicts
 - scene_count
 - scenes

