name: storyboard_dynamic_image_prompt
description: "storyboard image generate Shi De Dong Tai prompt text Pi Liang generate template(An scene Jie He script Shang Xia Wen)"
category: storyboard
version: "1.0"
author: "AI Video Studio"
created_at: "2026-06-11"
updated_at: "2026-06-11"

variables:
 story_tone:
 type: string
 required: false
 description: "story Ji Diao Zhai Yao(title/type/Shi Jie Guan Yi Ju Hua)"
 style:
 type: string
 required: false
 description: "Feng Ge Yao Qiu(style Zi Fu Chuan Yu style_spec Zhai Yao)"
 scene:
 type: dict
 required: true
 description: "Chang Jing Xin Xi(scene_number/location/time/description)"
 characters:
 type: list
 required: false
 description: "Chu Chang character She Ding list(dict: name/appearance)"
 dialogues:
 type: list
 required: false
 description: "Gai scene dialogue Wen Ben list"
 stage_notes:
 type: list
 required: false
 description: "Gai scene Wu Tai prompt list"
 frames:
 type: list
 required: true
 description: "pending generate prompt text De storyboard Zhen list(dict: frame_index/shot_type/camera_movement/composition/duration/description/prev_summary/next_summary)"

