name: episode_enrich
description: "Dang episode Yu Gu Shi length Bu Zu Shi, Feng Fu episode content Yi Man Zu target Shi length"
category: episode
version: "1.0"
author: "AI Video Studio"
created_at: "2025-12-24"
updated_at: "2025-12-24"

variables:
 story:
 type: dict
 required: true
 description: "story information object"
 episode:
 type: dict
 required: true
 description: "Dang Qian episode information(Xu Yao Feng Fu De Ban Ben)"
 target_duration_seconds:
 type: number
 required: true
 description: "target duration(seconds)"
 current_duration_seconds:
 type: number
 required: true
 description: "Dang Qian Yu Gu Shi length(seconds)"
 duration_gap_seconds:
 type: number
 required: true
 description: "Shi Chang Que Kou(seconds)"

output_format: "JSON"
expected_fields:
 - episodes
 - episode_number
 - title
 - summary
 - plot_points
 - character_arcs
 - conflicts
 - scene_count
 - total_estimated_duration_seconds
 - scenes

prompt: |
