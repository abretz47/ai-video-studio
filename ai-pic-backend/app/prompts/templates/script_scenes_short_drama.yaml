name: script_scenes_short_drama
description: "script scene planning prompt text template(short drama: Mei Ji Bi You Shuang Dian/cliffhanger)"
category: script
version: "1.0"
author: "AI Video Studio"
created_at: "2026-01-19"
updated_at: "2026-01-19"

variables:
 story:
 type: dict
 required: true
 description: "Gu Shi Xin Xi(title/type/summary/Ying Xiao Yuan information etc.)"

 episode:
 type: dict
 required: true
 description: "Ju Ji Xin Xi(Ji Shu/title/summary/Yu She scene etc.)"

 duration_minutes:
 type: number
 required: false
 description: "episode target Shi length(minutes), Yong Yu Shi length Gan Zhi scene Hua Fen"
 default: 0

 min_scene_seconds:
 type: number
 required: false
 description: "Dan scene Zui Xiao Shi length(seconds)"
 default: 10

 max_scene_seconds:
 type: number
 required: false
 description: "Dan scene Zui Da Shi length(seconds)"
 default: 120

 scene_detail_level:
 type: string
 required: false
 description: "scene Xi Jie Cheng Du"
 default: "medium"
 enum: ["minimal", "medium", "detailed", "cinematic"]

 format_type:
 type: string
 required: false
 description: "Ju Ben Ge Shi"
 default: "screenplay"
 enum: ["screenplay", "teleplay", "stage", "audio", "animation"]

 language:
 type: string
 required: false
 description: "language"
 default: "zh-CN"
 enum: ["zh-CN", "en-US", "ja-JP", "ko-KR"]

 style_preferences:
 type: list
 required: false
 description: "Style preference list"

 additional_requirements:
 type: string
 required: false
 description: "additional scene Yao Qiu"

 generation_mode:
 type: string
 required: false
 description: "Sheng Cheng Mo Shi"
 default: "standard"

 production_mode:
 type: boolean
 required: false
 description: "Shi Fou Wei production async generate"
 default: false

 script_score_thresholds:
 type: dict
 required: false
 description: "production ScriptScore Tong Guo Yu Zhi"

usage_examples:
 - story: { title: "Fan Ji Ren Sheng", story_format: "short_drama", genre: "Du Shi Shuang Ju" }
 episode:
 {
 episode_number: 1,
 title: "Zhua Jian Xian Chang",
 summary: "heroine Zhuang Jian betrayal Bing Dang Chang counterattack",
 }
 duration_minutes: 3
 scene_detail_level: "medium"
 format_type: "screenplay"
 language: "zh-CN"
