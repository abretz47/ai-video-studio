name: episode_generation
description: "episode generate prompt text template"
category: episode
version: "1.0"
author: "AI Video Studio"
created_at: "2025-08-15"
updated_at: "2025-08-15"

variables:
 story:
 type: dict
 required: true
 description: "story information object"

 episode_count:
 type: number
 required: true
 description: "Yao generate De episode count"
 min: 1
 max: 50

 episode_duration:
 type: number
 required: false
 description: "Mei Ji Shi Chang(minutes)"
 min: 5
 max: 120

 plot_complexity:
 type: string
 required: false
 description: "plot Fu Za Du"
 default: "medium"
 enum: ["simple", "medium", "complex"]

 pacing:
 type: string
 required: false
 description: "pacing control"
 default: "medium"
 enum: ["slow", "medium", "fast"]

 focus_characters:
 type: list
 required: false
 description: "Zhong Dian character list"

 additional_requirements:
 type: string
 required: false
 description: "E Wai Yao Qiu"
 max_length: 1000

 style_preferences:
 type: list
 required: false
 description: "Style preference list"

story_structure:
 act1: "opening He She Ding(Zhan Zong Ji Shu De25%)"
 act2: "Fa Zhan He conflict(Zhan Zong Ji Shu De50%)"
 act3: "climax He Jie Ju(Zhan Zong Ji Shu De25%)"

output_format: "JSON"
expected_fields:
 - episodes
 - episode_number
 - title
 - summary
 - plot_points
 - character_arcs
 - conflicts
 - scene_count
 - scenes
 - emotional_tone
 - key_moments
 - cliffhanger

guidelines:
 pacing:
 slow: "Zhu Zhong character Xin Li Miao Xie He Xi Jie Ke Hua"
 medium: "Ping Heng plot Tui Jin He character Fa Zhan"
 fast: "Kuai Jie Zou Tui Jin, Gao Mi Du plot"

 complexity:
 simple: "Dan Yi Zhu Xian, Qing Xi Ming Liao"
 medium: "Zhu Fu Xian Bing Xing, Shi Du Fu Za"
 complex: "Duo Xian Jiao Zhi, Ceng Ci Feng Fu"
