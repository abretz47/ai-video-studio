name: script_generation
description: "script generate prompt text template"
category: script
version: "1.0"
author: "AI Video Studio"
created_at: "2025-08-15"
updated_at: "2025-08-15"

variables:
 story:
 type: dict
 required: true
 description: "story information object"

 episode:
 type: dict
 required: true
 description: "episode information object"

 format_type:
 type: string
 required: true
 description: "script format type"
 default: "screenplay"
 enum: ["screenplay", "teleplay", "stage", "audio", "animation"]

 language:
 type: string
 required: false
 description: "Ju Ben Yu Yan"
 default: "zh-CN"
 enum: ["zh-CN", "en-US", "ja-JP", "ko-KR"]

 dialogue_style:
 type: string
 required: false
 description: "Dui Hua Feng Ge"
 default: "natural"
 enum: ["natural", "formal", "casual", "dramatic", "comedic"]

 scene_detail_level:
 type: string
 required: false
 description: "scene description Xiang Xi Cheng Du"
 default: "medium"
 enum: ["minimal", "medium", "detailed", "cinematic"]

 additional_requirements:
 type: string
 required: false
 description: "E Wai Yao Qiu"
 max_length: 1000

 style_preferences:
 type: list
 required: false
 description: "Style preference list"

format_specifications:
 screenplay:
 structure: "Dian Ying Ju Ben format"
 scene_header: "INT./EXT. location - time"
 character_name: "Jue Se Ming(Ju Zhong Da Xie)"
 dialogue: "Dui Hua Nei Rong"
 action: "Dong Zuo Miao Shu(Xian Zai Shi)"

 teleplay:
 structure: "Dian Shi Ju Ben format"
 scene_header: "scene location time"
 character_name: "Jue Se Ming: "
 dialogue: "Dui Hua Nei Rong"
 action: "【Dong Zuo Miao Shu】"

 stage:
 structure: "Wu Tai Ju Ben format"
 scene_header: "DiXChang"
 character_name: "Jue Se Ming: "
 dialogue: "Dui Hua Nei Rong"
 action: "(Wu Tai Zhi Shi)"

dialogue_guidelines:
 natural: "Ri Chang Hua, Sheng Huo Hua De conversation"
 formal: "Zheng Shi, Gui Fan De Biao Da"
 casual: "Qing Song, Sui Yi De Yu Diao"
 dramatic: "Fu You Zhang Li He Xi Ju Xing"
 comedic: "You Mo, Hui Xie De style"

scene_detail_guidelines:
 minimal: "Jian Jie De scene description, Jin key information"
 medium: "Shi Du Xiang Xi, Bao Han Bi Yao De Shi Jue information"
 detailed: "Xiang Xi De scene description, Bao Han Fen Wei He Xi Jie"
 cinematic: "film Ji Bie De Shi Jue description, Bao Han camera language"

output_format: "JSON"
expected_fields:
 - content
 - scenes
 - dialogues
 - stage_directions
 - metadata

quality_requirements:
 - "character conversation Fu He Ren Wu Xing Ge"
 - "scene Zhuan Huan Zi Ran Liu Chang"
 - "plot Tui Jin logic Qing Xi"
 - "Shi length Kong Zhi Zhun Que"
 - "format Gui Fan Biao Zhun"
