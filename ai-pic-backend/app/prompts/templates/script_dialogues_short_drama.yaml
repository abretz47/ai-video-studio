name: script_dialogues_short_drama
description: "script dialogue Yu stage directions generate prompt text template(short drama: Gao Chong Tu/Gao Shuang Dian/Qiang Ka Dian)"
category: script
version: "1.0"
author: "AI Video Studio"
created_at: "2026-01-19"
updated_at: "2026-01-19"

variables:
 language:
 type: string
 required: false
 description: "Dui Bai Yu Yan"
 default: "zh-CN"
 enum: ["zh-CN", "en-US", "ja-JP", "ko-KR"]

 dialogue_style:
 type: string
 required: false
 description: "Dui Bai Feng Ge"
 default: "natural"
 enum: ["natural", "formal", "casual", "dramatic", "comedic"]

 format_type:
 type: string
 required: false
 description: "Ju Ben Ge Shi"
 default: "screenplay"
 enum: ["screenplay", "teleplay", "stage", "audio", "animation"]

 story:
 type: dict
 required: false
 description: "story summary information"

 episode:
 type: dict
 required: false
 description: "Ju Ji Xin Xi"

 scenes:
 type: list
 required: true
 description: "Chang Jing Lie Biao(scene_number/slug_line/summary etc.)"
 min_length: 1

usage_examples:
 - language: "zh-CN"
 dialogue_style: "natural"
 format_type: "screenplay"
 story: { title: "Fan Ji Ren Sheng", story_format: "short_drama", genre: "Du Shi Shuang Ju" }
 episode: { episode_number: 1, title: "Zhua Jian Xian Chang" }
 scenes:
 - scene_number: 1
 slug_line: "INT. Wo Shi - night"
 summary: "Kai Chang Gou Zi: heroine Zhuang Jian betrayal"
 - scene_number: 2
 slug_line: "INT. Wo Shi - night"
 summary: "Shuang Dian: heroine Dang Chang counterattack Bing Liu Xia evidence"
 - scene_number: 3
 slug_line: "INT. Zou Lang - night"
 summary: "cliffhanger: Fan Pai Liang Chu Geng Da Ba Bing"
