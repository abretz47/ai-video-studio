name: episode_list
description: "episode Da Gang Fen Ji planning prompt text template"
category: episode
version: "1.0"
author: "AI Video Studio"
created_at: "2025-12-10"
updated_at: "2025-12-10"

variables:
 story:
 type: dict
 required: true
 description: "story basic information(title, type, summary, Chong Tu Deng)"

 episode_count:
 type: number
 required: true
 description: "Xu Yao generate De Zong Ji Shu"
 min: 1

 episode_duration:
 type: number
 required: false
 description: "Dan Ji Shi Chang(minutes)"
 default: 30

 plot_complexity:
 type: string
 required: false
 description: "drama Fu Za Du"
 default: "medium"
 enum: ["simple", "medium", "complex"]

 pacing:
 type: string
 required: false
 description: "pacing control"
 default: "balanced"
 enum: ["slow", "balanced", "fast"]

 focus_characters:
 type: list
 required: false
 description: "Zhong Dian character list"

 additional_requirements:
 type: string
 required: false
 description: "additional Chuang Zuo Huo structure Yao Qiu"

usage_examples:
 - story:
 title: "Du Shi Lian Qu"
 genre: "romance"
 synopsis: "Liang Ren Zai Kuai Jie Zou city Zhong Xiang Yu Xiang Zhi"
 main_conflict: "Shi Ye Yu romance De Jue Ze"
 episode_count: 12
 episode_duration: 20
 plot_complexity: "medium"
 pacing: "balanced"
