name: virtual_ip_creation
description: "virtualIPcharacter create prompt text template"
category: character
version: "1.0"
author: "AI Video Studio"
created_at: "2025-08-15"
updated_at: "2025-08-15"

variables:
 name:
 type: string
 required: true
 description: "character name"
 min_length: 1
 max_length: 50

 description:
 type: string
 required: false
 description: "character basic description"
 max_length: 500

 age:
 type: string
 required: false
 description: "Jue Se Nian Ling"

 gender:
 type: string
 required: false
 description: "Jue Se Xing Bie"

 personality_traits:
 type: list
 required: false
 description: "Xing Ge Te Dian list"

 style_preference:
 type: string
 required: false
 description: "style preference"

 target_audience:
 type: string
 required: false
 description: "Target audience"

 content_type:
 type: string
 required: false
 description: "Nei Rong Lei Xing"

usage_examples:
 - name: "Mia"
 description: "a lively and lovely young woman"
 age: "22 years old"
 gender: "female"
 personality_traits: ["lively", "curious", "optimistic"]
 style_preference: "modern fashion"
 target_audience: "young adults"
 content_type: "Ri Chang Sheng Huo"

output_format: "JSON"
expected_fields:
 - detailed_description
 - background_story
 - personality
 - skills
 - relationships
 - lifestyle
 - signature_traits
 - development_potential
 - visual_description
 - suggested_tags
