name: episode_from_outline_short_drama
description: "based on Step Outline Shu Chu Dan Ji Episode Plan(short drama)"
category: episode
version: "1.0"
author: "AI Video Studio"
created_at: "2026-01-18"
updated_at: "2026-01-18"

variables:
 story:
 type: dict
 required: true
 description: "story information object"
 outline:
 type: dict
 required: true
 description: "Dan Ji Step Outline(Han logline, beats optional)"
 previous_episodes:
 type: list
 required: false
 description: "Yi generate De Qian Xu Ji list(episode_number/title/logline)"
 episode_duration:
 type: number
 required: false
 description: "target duration(minutes)"
 plot_complexity:
 type: string
 required: false
 description: "plot Fu Za Du simple/medium/complex"
 pacing:
 type: string
 required: false
 description: "pacing slow/medium/fast"
 additional_requirements:
 type: string
 required: false
 description: "E Wai Yao Qiu"
 style_preferences:
 type: list
 required: false
 description: "style preference"

output_format: "JSON"
expected_fields:
 - episodes
