name: virtual_ip_image_variant
description: "virtual IP Tu Sheng image Bian Ti prompt text(Zhi Jie Yong Yu image model)"
category: image
version: "1.3"
author: "AI Video Studio"
created_at: "2026-01-09"
updated_at: "2026-01-12"

variables:
 character_name:
 type: string
 required: true
 description: "character name"
 min_length: 1

 variant_prompt:
 type: string
 required: true
 description: "Bian Ti/Bian Hua Zhi Ling(Li Ru back view Zhao, full-body shot, Bu Tong Guang Xian etc.)"
 min_length: 1

 character_description:
 type: string
 required: false
 description: "character Wai Guan Yu She Ding description(optional)"

 background_story:
 type: string
 required: false
 description: "Bei Jing Gu Shi(optional)"

 style:
 type: string
 required: false
 description: "style(realistic/anime/cartoon/...)"
 default: "realistic"

 category:
 type: string
 required: false
 description: "Tu Xiang Lei Bie(portrait/full_body/action/emotion/...)"
 default: "portrait"

 style_prompt:
 type: string
 required: false
 description: "style Bu Chong prompt text(optional)"

 base_prompt:
 type: string
 required: false
 description: "basic image generate Shi De prompt(optional)"

usage_examples:
 - character_name: "Mia"
 variant_prompt: "back-view shot, full-body shot, keep consistent character features"
 character_description: "22 years oldfemale, Yin Se Duan Fa, Jing Zhi Wu Guan, Qi Zhi Qing Leng, Hei Se Gao Ling Mao Yi"
 style: "realistic"
 category: "portrait"
